[project]
name = "horse-racing-scheduler"
version = "0.1.0-dev"
description = "中央競馬自動投票システムをスケジュール制御する"
authors = [
    {name = "u6k",email = "u6k.apps@gmail.com"}
]
license = {text = "MIT License"}
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "apscheduler (>=3.11.1,<4.0.0)",
    "pika (>=1.3.2,<2.0.0)",
    "boto3 (>=1.41.5,<2.0.0)"
]

[dependency-groups]
dev = [
    "isort (>=7.0.0,<8.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "flake8-pyproject (>=1.2.4,<2.0.0)",
    "pytest (>=9.0.1,<10.0.0)",
    "autopep8 (>=2.3.2,<3.0.0)",
    "poethepoet (>=0.38.0,<0.39.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
